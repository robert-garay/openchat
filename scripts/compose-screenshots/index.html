<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1290">
  <title>OpenChat Screenshot Compositor</title>
  <link rel="stylesheet" href="compose.css">
</head>
<body>
  <!-- Plate 01 — Hero (dark) -->
  <section class="plate plate--dark" id="plate-01" data-shot="01" aria-label="Shot 1 — Hero">
    <img class="plate__capture" src="../../screenshots/compose/raw/shot-01.png" width="1290" height="2796" alt="">
    <div class="plate__scrim" aria-hidden="true"></div>
    <div class="plate__overlay">
      <img class="plate__mark" src="../../website/assets/openchat-mark.png" width="96" height="96" alt="">
      <h1 class="plate__headline">Every model. One app.</h1>
      <p class="plate__subhead">Your device. Your keys.</p>
    </div>
  </section>

  <!-- Plate 02 — Active chat (dark) -->
  <section class="plate plate--dark" id="plate-02" data-shot="02" aria-label="Shot 2 — Active chat">
    <img class="plate__capture" src="../../screenshots/compose/raw/shot-02.png" width="1290" height="2796" alt="">
    <div class="plate__scrim" aria-hidden="true"></div>
    <div class="plate__overlay">
      <h1 class="plate__headline">Native chat with Markdown &amp; code</h1>
    </div>
  </section>

  <!-- Plate 03 — Model picker (light) -->
  <section class="plate plate--light" id="plate-03" data-shot="03" aria-label="Shot 3 — Model picker">
    <img class="plate__capture" src="../../screenshots/compose/raw/shot-03.png" width="1290" height="2796" alt="">
    <div class="plate__scrim" aria-hidden="true"></div>
    <div class="plate__overlay">
      <h1 class="plate__headline">Switch providers without switching apps</h1>
    </div>
  </section>

  <!-- Plate 04 — Settings / Providers (light) -->
  <section class="plate plate--light" id="plate-04" data-shot="04" aria-label="Shot 4 — Settings providers">
    <img class="plate__capture" src="../../screenshots/compose/raw/shot-04.png" width="1290" height="2796" alt="">
    <div class="plate__scrim" aria-hidden="true"></div>
    <div class="plate__overlay">
      <h1 class="plate__headline">Your keys, your providers</h1>
      <p class="plate__subhead">Bring your own key</p>
    </div>
  </section>

  <!-- Plate 05 — Web search (light) -->
  <section class="plate plate--light" id="plate-05" data-shot="05" aria-label="Shot 5 — Web search">
    <img class="plate__capture" src="../../screenshots/compose/raw/shot-05.png" width="1290" height="2796" alt="">
    <div class="plate__scrim" aria-hidden="true"></div>
    <div class="plate__overlay">
      <h1 class="plate__headline">Optional web search, your keys</h1>
    </div>
  </section>

  <!-- Plate 06 — Rules or memory (dark) -->
  <section class="plate plate--dark" id="plate-06" data-shot="06" aria-label="Shot 6 — Rules">
    <img class="plate__capture" src="../../screenshots/compose/raw/shot-06.png" width="1290" height="2796" alt="">
    <div class="plate__scrim" aria-hidden="true"></div>
    <div class="plate__overlay">
      <h1 class="plate__headline">Steer behavior with rules &amp; memory</h1>
    </div>
  </section>

  <!-- Plate 07 — Skills (dark) -->
  <section class="plate plate--dark" id="plate-07" data-shot="07" aria-label="Shot 7 — Skills">
    <img class="plate__capture" src="../../screenshots/compose/raw/shot-07.png" width="1290" height="2796" alt="">
    <div class="plate__scrim" aria-hidden="true"></div>
    <div class="plate__overlay">
      <h1 class="plate__headline">Reusable prompts with / commands</h1>
    </div>
  </section>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var plate = params.get("plate");
      if (!plate) return;

      document.body.classList.add("export-mode");
      var target = document.getElementById("plate-" + plate);
      if (target) target.classList.add("is-export-target");
    })();
  </script>
</body>
</html>
