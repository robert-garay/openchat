<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1290">
  <title>OpenChat Screenshot Compositor</title>
  <link rel="stylesheet" href="compose.css">
</head>
<body>
  <!-- Shot 01 — Hero (dark) -->
  <section class="shot shot--dark" id="shot-01" data-shot="01" aria-label="Shot 1 — Hero">
    <div class="shot__bg" aria-hidden="true"></div>
    <div class="shot__copy">
      <h1 class="shot__headline">Every model. One app.</h1>
      <p class="shot__subhead">Your device. Your keys.</p>
    </div>
    <div class="shot__device">
      <div class="shot__device-frame">
        <img class="shot__capture" data-raw="shot-01.png" src="../../screenshots/compose/raw/shot-01.png" width="940" alt="">
      </div>
    </div>
  </section>

  <!-- Shot 02 — Active chat (dark); capture should show GPT-6 Astra or Claude Fable in header -->
  <section class="shot shot--dark" id="shot-02" data-shot="02" aria-label="Shot 2 — Active chat">
    <div class="shot__bg" aria-hidden="true"></div>
    <div class="shot__copy">
      <h1 class="shot__headline">Native chat with Markdown &amp; code</h1>
    </div>
    <div class="shot__device">
      <div class="shot__device-frame">
        <img class="shot__capture" data-raw="shot-02.png" src="../../screenshots/compose/raw/shot-02.png" width="940" alt="">
      </div>
    </div>
  </section>

  <!-- Shot 03 — Model picker (light) -->
  <section class="shot shot--light" id="shot-03" data-shot="03" aria-label="Shot 3 — Model picker">
    <div class="shot__bg" aria-hidden="true"></div>
    <div class="shot__copy">
      <h1 class="shot__headline">Switch providers without switching apps</h1>
    </div>
    <div class="shot__device">
      <div class="shot__device-frame">
        <img class="shot__capture" data-raw="shot-03.png" src="../../screenshots/compose/raw/shot-03.png" width="940" alt="">
      </div>
    </div>
  </section>

  <!-- Shot 04 — Settings / Providers (light); capture should list OpenRouter first -->
  <section class="shot shot--light" id="shot-04" data-shot="04" aria-label="Shot 4 — Settings providers">
    <div class="shot__bg" aria-hidden="true"></div>
    <div class="shot__copy">
      <h1 class="shot__headline">Your keys, your providers</h1>
      <p class="shot__subhead">Bring your own key</p>
    </div>
    <div class="shot__device">
      <div class="shot__device-frame">
        <img class="shot__capture" data-raw="shot-04.png" src="../../screenshots/compose/raw/shot-04.png" width="940" alt="">
      </div>
    </div>
  </section>

  <!-- Shot 05 — Web search (light) -->
  <section class="shot shot--light" id="shot-05" data-shot="05" aria-label="Shot 5 — Web search">
    <div class="shot__bg" aria-hidden="true"></div>
    <div class="shot__copy">
      <h1 class="shot__headline">Optional web search, your keys</h1>
    </div>
    <div class="shot__device">
      <div class="shot__device-frame">
        <img class="shot__capture" data-raw="shot-05.png" src="../../screenshots/compose/raw/shot-05.png" width="940" alt="">
      </div>
    </div>
  </section>

  <!-- Shot 06 — Rules or memory (dark) -->
  <section class="shot shot--dark" id="shot-06" data-shot="06" aria-label="Shot 6 — Rules">
    <div class="shot__bg" aria-hidden="true"></div>
    <div class="shot__copy">
      <h1 class="shot__headline">Steer behavior with rules &amp; memory</h1>
    </div>
    <div class="shot__device">
      <div class="shot__device-frame">
        <img class="shot__capture" data-raw="shot-06.png" src="../../screenshots/compose/raw/shot-06.png" width="940" alt="">
      </div>
    </div>
  </section>

  <!-- Shot 07 — Skills (dark) -->
  <section class="shot shot--dark" id="shot-07" data-shot="07" aria-label="Shot 7 — Skills">
    <div class="shot__bg" aria-hidden="true"></div>
    <div class="shot__copy">
      <h1 class="shot__headline">Reusable prompts with / commands</h1>
    </div>
    <div class="shot__device">
      <div class="shot__device-frame">
        <img class="shot__capture" data-raw="shot-07.png" src="../../screenshots/compose/raw/shot-07.png" width="940" alt="">
      </div>
    </div>
  </section>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var shot = params.get("shot") || params.get("plate");
      var rawDir = params.get("rawDir");

      if (rawDir) {
        document.querySelectorAll(".shot__capture").forEach(function (img) {
          var name = img.getAttribute("data-raw");
          if (name) img.src = rawDir.replace(/\/?$/, "/") + name;
        });
      }

      if (!shot) return;

      document.body.classList.add("export-mode");
      var target = document.getElementById("shot-" + shot);
      if (target) target.classList.add("is-export-target");
    })();
  </script>
</body>
</html>
