name: OpenChat
options:
  bundleIdPrefix: com.genion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

# Project-level signing: Local.xcconfig (gitignored) supplies DEVELOPMENT_TEAM.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

fileGroups:
  - Config

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenChat:
    type: application
    platform: iOS
    sources:
      - path: OpenChat
        excludes:
          - "Resources/Info.plist"
    info:
      path: OpenChat/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHealthShareUsageDescription: OpenChat reads only fitness-related Apple Health data you enable—steps, heart rate, workouts, energy, exercise time, walking/running distance, and sleep—for coaching insights. It does not access clinical records. This is not medical advice.
        NSCameraUsageDescription: OpenChat uses the camera so agents can analyze photos or documents you capture.
        NSMicrophoneUsageDescription: OpenChat uses the microphone for voice input and transcription when you enable it.
        NSPhotoLibraryUsageDescription: OpenChat accesses photos you select so agents can analyze images.
        NSCalendarsFullAccessUsageDescription: OpenChat reads your calendar so agents can help with schedules. If you allow editing, agents may propose event changes that you confirm in the app before anything is saved.
    entitlements:
      path: OpenChat/Resources/OpenChat.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_NAME: OpenChat
        PRODUCT_BUNDLE_IDENTIFIER: com.genion.openchat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
    capabilities: {}

  OpenChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenChatTests
    dependencies:
      - target: OpenChat
    configFiles:
      Debug: Config/SigningTests.xcconfig
      Release: Config/SigningTests.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.genion.openchat.tests

schemes:
  OpenChat:
    build:
      targets:
        OpenChat: all
        OpenChatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - OpenChat
      targets:
        - name: OpenChatTests
          parallelizable: true
          randomExecutionOrder: true
    archive:
      config: Release
