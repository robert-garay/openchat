name: OpenChat
options:
  bundleIdPrefix: com.genion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "17.0"

configs:
  Debug: debug
  Release: release

# Project-level signing: Local.xcconfig (gitignored) supplies DEVELOPMENT_TEAM.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

fileGroups:
  - Config

packages:
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    branch: main

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  OpenChat:
    type: application
    platform: iOS
    sources:
      - path: OpenChat
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - sdk: AppIntents.framework
      - package: SwiftStreamingMarkdown
      - target: OpenChatLiveActivity
    info:
      path: OpenChat/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: OpenChat uses the camera so agents can analyze photos or documents you capture.
        NSMicrophoneUsageDescription: OpenChat uses the microphone for voice input and transcription when you enable it.
        NSPhotoLibraryUsageDescription: OpenChat accesses photos you select so agents can analyze images.
        NSPhotoLibraryAddUsageDescription: OpenChat saves images to your photo library when you choose Save to Photos.
        NSSupportsLiveActivities: true
    entitlements:
      path: OpenChat/Resources/OpenChat.entitlements
    settings:
      base:
        PRODUCT_NAME: OpenChat
        PRODUCT_BUNDLE_IDENTIFIER: com.genion.openchat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
    capabilities: {}

  OpenChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenChatTests
    dependencies:
      - target: OpenChat
      - sdk: AppIntents.framework
    configFiles:
      Debug: Config/SigningTests.xcconfig
      Release: Config/SigningTests.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.genion.openchat.tests
        GENERATE_INFOPLIST_FILE: YES

  OpenChatLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenChatLiveActivityExtension
      - path: OpenChat/Services/OpenChatLiveActivityAttributes.swift
      - path: OpenChat/Resources/SharedAssets.xcassets
    info:
      path: OpenChatLiveActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: OpenChat Live Activity
        CFBundleName: OpenChatLiveActivity
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: OpenChatLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.genion.openchat.liveactivity
        INFOPLIST_FILE: OpenChatLiveActivityExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO

schemes:
  OpenChat:
    build:
      targets:
        OpenChat: all
        OpenChatLiveActivity: all
        OpenChatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - OpenChat
      targets:
        - name: OpenChatTests
          parallelizable: true
          randomExecutionOrder: true
    archive:
      config: Release
