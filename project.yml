name: OpenChat
options:
  bundleIdPrefix: com.openchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenChat:
    type: application
    platform: iOS
    sources:
      - path: OpenChat
        excludes:
          - "Resources/Info.plist"
    info:
      path: OpenChat/Resources/Info.plist
      properties:
        CFBundleDisplayName: OpenChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        OPENCHAT_MANAGED_OPENROUTER_API_KEY: $(OPENCHAT_MANAGED_OPENROUTER_API_KEY)
    settings:
      base:
        PRODUCT_NAME: OpenChat
        PRODUCT_BUNDLE_IDENTIFIER: com.openchat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    capabilities: {}

  OpenChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenChatTests
    dependencies:
      - target: OpenChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openchat.app.tests

schemes:
  OpenChat:
    build:
      targets:
        OpenChat: all
        OpenChatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenChatTests
    archive:
      config: Release
